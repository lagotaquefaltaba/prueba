<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" sizes="192x192" href="https://i.imgur.com/yFf6ykG.jpeg">
<link rel="apple-touch-icon" href="https://i.imgur.com/yFf6ykG.jpeg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirta Club</title>

<link rel="manifest" href="manifest.json">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/service-worker.js');
  });
}
</script>

<meta name="theme-color" content="#000000">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;padding:10px;padding-bottom:90px;}
.contenedor{max-width:450px;margin:auto;background:#111;border-radius:30px;box-shadow:0 0 20px rgba(255,0,255,0.3);padding:25px;text-align:center;border:1px solid #333}

/* ESTILO VIGÍA - ANIMACIONES */
.logo-radio{width:150px;height:150px;border-radius:50%;margin-bottom:20px;border:4px solid #ff00ff;object-fit:cover; animation: pulso 2s infinite;}
@keyframes pulso { 0% {box-shadow: 0 0 0 0 rgba(255,0,255, 0.7);} 70% {box-shadow: 0 0 0 15px rgba(255,0,255, 0);} 100% {box-shadow: 0 0 0 0 rgba(255,0,255, 0);} }

h1{color:#fff;font-size:26px;margin-bottom:25px;text-transform:uppercase;letter-spacing:3px; animation: parpadeo 1.5s infinite;}
@keyframes parpadeo { 0% {text-shadow: 0 0 5px #ff00ff;} 50% {text-shadow: 0 0 20px #ff00ff;} 100% {text-shadow: 0 0 5px #ff00ff;} }

/* GALERÍA */
#galeria-contenido { display: none; margin-top: 15px; }
.gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gallery-grid img { width: 100%; border-radius: 15px; border: 2px solid #ff00ff; cursor: pointer; transition: 0.3s; }
.gallery-grid img:hover { transform: scale(1.05); }

/* BOTONES NEÓN */
.boton{display:flex;align-items:center;justify-content:center;width:100%;padding:14px;margin-bottom:12px;border-radius:20px;color:#fff;text-decoration:none;font-size:16px;font-weight:bold;transition:0.3s;border:2px solid #ff00ff;background:transparent;cursor:pointer; animation: bordeNeon 3s infinite;}
@keyframes bordeNeon { 0% {border-color: #ff00ff;} 50% {border-color: #00d2ff;} 100% {border-color: #ff00ff;} }
.boton:hover{background:#ff00ff;color:#000}

.boton-instalar-nuevo{display:none;position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#ff00ff;color:#fff;border:none;padding:15px 35px;font-size:15px;font-weight:bold;border-radius:50px;cursor:pointer;box-shadow:0 0 20px #ff00ff;z-index:9999;letter-spacing:1px;text-transform:uppercase}
</style>
</head>
<body>

<div class="contenedor">
    <img class="logo-radio" src="https://i.imgur.com/yFf6ykG.jpeg" alt="Logo Mirta Club">
    <h1>Mirta Club</h1>

    <a class="boton" href="https://wa.me/5493462598048" target="_blank">Reservas VIP - WhatsApp</a>
    <button class="boton" onclick="toggleGallery()">Ver Fotos del Boliche</button>

    <div id="galeria-contenido">
        <div class="gallery-grid">
            <img src="https://i.imgur.com/pbg6AuH.jpeg">
            <img src="https://i.imgur.com/GesBT4d.jpeg">
        </div>
    </div>

    <div style="color:#666;font-size:11px;margin-top:30px;">
        👁️ El Vigía - Todos los derechos reservados.<br>
        Contacto: 3462598048
    </div>
</div>

<button id="botonInstalar" class="boton-instalar-nuevo">📲 INSTALAR MIRTA CLUB</button>

<script>
function toggleGallery() {
    var x = document.getElementById("galeria-contenido");
    x.style.display = (x.style.display === "block") ? "none" : "block";
}

let eventoInstalar;
const botonInstalar = document.getElementById('botonInstalar');
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    eventoInstalar = e;
    botonInstalar.style.display = 'block';
});
botonInstalar.addEventListener('click', async () => {
    if (eventoInstalar) {
        eventoInstalar.prompt();
    }
});
</script>
</body>
</html>
