<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="https://i.imgur.com/yFf6ykG.jpeg">
<title>Mirta Club</title>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js');
    });
  }
</script>
</head>
<body>
<button id="btnInstalar" style="display:none;">📲 INSTALAR MIRTA CLUB</button>
<script>
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('btnInstalar').style.display = 'block';
  });
  document.getElementById('btnInstalar').addEventListener('click', () => {
    deferredPrompt.prompt();
  });
</script>
</body>
</html>
