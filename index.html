<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="https://i.imgur.com/yFf6ykG.jpeg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirta Club - App Oficial</title>
<meta name="theme-color" content="#000000">

<link rel="manifest" href='data:application/manifest+json,{"name":"Mirta Club","short_name":"MirtaClub","start_url":"index.html","display":"standalone","background_color":"#000000","theme_color":"#000000","icons":[{"src":"https://i.imgur.com/yFf6ykG.jpeg","sizes":"512x512","type":"image/jpeg"}]}'>

<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:#000;padding:10px;padding-bottom:90px;}
    .contenedor{max-width:450px;margin:auto;background:#111;border-radius:30px;box-shadow:0 0 20px rgba(255,0,255,0.3);padding:25px;text-align:center;border:1px solid #333}
    
    .logo-img{width:150px;height:150px;border-radius:50%;margin-bottom:20px;border:4px solid #ff00ff;object-fit:cover; animation: pulso 2s infinite;}
    @keyframes pulso { 0% {box-shadow: 0 0 0 0 rgba(255,0,255, 0.7);} 70% {box-shadow: 0 0 0 15px rgba(255,0,255, 0);} 100% {box-shadow: 0 0 0 0 rgba(255,0,255, 0);} }

    h1{color:#fff;font-size:26px;margin-bottom:25px;text-transform:uppercase;letter-spacing:3px; animation: parpadeo 1.5s infinite;}
    @keyframes parpadeo { 0% {text-shadow: 0 0 5px #ff00ff;} 50% {text-shadow: 0 0 20px #ff00ff;} 100% {text-shadow: 0 0 5px #ff00ff;} }

    .grid-botones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .boton{display:flex;align-items:center;justify-content:center;padding:12px;border-radius:20px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;transition:0.3s;border:2px solid #ff00ff;background:transparent;cursor:pointer; animation: bordeNeon 3s infinite;}
    @keyframes bordeNeon { 0% {border-color: #ff00ff;} 50% {border-color: #00d2ff;} 100% {border-color: #ff00ff;} }
    .boton:hover{background:#ff00ff;color:#000}
    .full-width { grid-column: span 2; }
    .btn-destacado{background:linear-gradient(45deg, #ff00ff, #7000ff); border:none;}

    .seccion-contenido { display: none; margin-top: 15px; }
    .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 15px; border: 2px solid #ff00ff; margin-bottom: 15px; }
    .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .gallery-grid img { width: 100%; border-radius: 15px; border: 2px solid #ff00ff; }

    /* BOTÓN INSTALAR */
    #btnInstalar{display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#ff00ff; color:#fff; padding:15px 30px; border-radius:50px; border:none; font-weight:bold; cursor:pointer; z-index:1000;}

    .sello-vigia{color:#666;font-size:11px;margin-top:30px;text-align:center;}
</style>
</head>
<body>

<div class="contenedor">
    <img class="logo-img" src="https://i.imgur.com/yFf6ykG.jpeg" alt="Logo Mirta Club">
    <h1>Mirta Club</h1>

    <div class="grid-botones">
        <a class="boton full-width btn-destacado" href="https://wa.me/5493462598048" target="_blank">Reservas VIP - WhatsApp</a>
        <button class="boton" onclick="mostrarSeccion('cartelera-seccion')">Cartelera</button>
        <button class="boton" onclick="mostrarSeccion('video-seccion')">Videos</button>
        <button class="boton" onclick="mostrarSeccion('galeria-seccion')">Fotos</button>
        <a class="boton" href="#" target="_blank">Facebook</a>
        <a class="boton" href="#" target="_blank">Instagram</a>
        <a class="boton full-width" href="https://wa.me/5493462598048?text=Hola!%20Les%20cuento%20que%20el%20boliche%20estuvo..." target="_blank">Comentarios / Opiniones 💬</a>
    </div>

    <div id="cartelera-seccion" class="seccion-contenido">
        <p style="color:#ff00ff; margin-bottom:10px;">¡Lo que viene este finde!</p>
    </div>

    <div id="video-seccion" class="seccion-contenido">
        <div class="video-wrapper">
            <iframe id="videoIframe" src="https://mega.nz/embed/eU43kSgC#-Sc51QGWBp3pJ6emuqJJgMQr1QFOHnTyvc0sy-LN6Ac" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <div id="galeria-seccion" class="seccion-contenido">
        <div class="gallery-grid">
            <a href="https://i.imgur.com/pbg6AuH.jpeg" download><img src="https://i.imgur.com/pbg6AuH.jpeg"></a>
            <a href="https://i.imgur.com/GesBT4d.jpeg" download><img src="https://i.imgur.com/GesBT4d.jpeg"></a>
        </div>
    </div>

    <div class="sello-vigia">
        👁️ El Vigía - Todos los derechos reservados.<br>
        ¿Querés tu propia App? Contacto: 3462598048
    </div>
</div>

<button id="btnInstalar">📲 INSTALAR MIRTA CLUB</button>

<script>
    // Lógica para mostrar secciones y apagar video
    function mostrarSeccion(id) {
        var iframe = document.getElementById('videoIframe');
        if (id !== 'video-seccion') {
            var src = iframe.src;
            iframe.src = '';
            iframe.src = src;
        }
        var secciones = document.getElementsByClassName('seccion-contenido');
        for (var i = 0; i < secciones.length; i++) { secciones[i].style.display = 'none'; }
        document.getElementById(id).style.display = 'block';
    }

    // Lógica para INSTALAR
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('btnInstalar').style.display = 'block';
    });

    document.getElementById('btnInstalar').addEventListener('click', () => {
        deferredPrompt.prompt();
    });
</script>
</body>
</html>
